---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Function Options
description: Takes a function and returns various fields from its config.yaml file

inputs:
  function:
    description: Function Name
    required: true

outputs:
  environment:
    description: Fission environment name
    value: ${{ steps.options.outputs.environment }}
  language:
    description: Programming language (python, node, go)
    value: ${{ steps.options.outputs.language }}
  language-version:
    description: Numeric language version (e.g. 3.11, 20, 1.21)
    value: ${{ steps.options.outputs.language-version }}
  runtime:
    description: Runtime version (e.g. 3.11, 20, 1.21)
    value: ${{ steps.options.outputs.runtime }}
  source:
    description: Source repository URL
    value: ${{ steps.options.outputs.source }}
  version:
    description: Function version
    value: ${{ steps.options.outputs.version }}

runs:
  using: composite
  steps:
    - name: Function Options
      id: options
      shell: bash
      working-directory: ./functions/${{ inputs.function }}
      run: |
        ENVIRONMENT=$(yq -r '.environment' config.yaml)
        RUNTIME=$(yq -r '.runtime' config.yaml)
        SOURCE=$(yq -r '.source' config.yaml)
        VERSION=$(yq -r '.version' config.yaml)

        # Derive language and numeric version from runtime prefix
        # Handles formats like python311 → 3.11, python3.11 → 3.11, node20 → 20, go1.21 → 1.21
        case "${RUNTIME}" in
          python*)
            LANGUAGE="python"
            RAW=$(echo "${RUNTIME}" | sed 's/python//')
            # If no dot, insert one after first digit (311 → 3.11)
            if echo "${RAW}" | grep -qE '^\.[0-9]'; then
              LANGUAGE_VERSION=$(echo "${RAW}" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
            elif echo "${RAW}" | grep -qE '^[0-9]\.[0-9]'; then
              LANGUAGE_VERSION="${RAW}"
            else
              MAJOR=$(echo "${RAW}" | cut -c1)
              MINOR=$(echo "${RAW}" | cut -c2-)
              LANGUAGE_VERSION="${MAJOR}.${MINOR}"
            fi
            ;;
          node*)
            LANGUAGE="node"
            LANGUAGE_VERSION=$(echo "${RUNTIME}" | grep -oE '[0-9]+' | head -1)
            ;;
          go*)
            LANGUAGE="go"
            LANGUAGE_VERSION=$(echo "${RUNTIME}" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' || echo "${RUNTIME}" | grep -oE '[0-9]+')
            ;;
          *)
            LANGUAGE=""
            LANGUAGE_VERSION=""
            ;;
        esac

        echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
        echo "language=${LANGUAGE}" >> $GITHUB_OUTPUT
        echo "language-version=${LANGUAGE_VERSION}" >> $GITHUB_OUTPUT
        echo "runtime=${RUNTIME}" >> $GITHUB_OUTPUT
        echo "source=${SOURCE}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
