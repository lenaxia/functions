---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Release Tag
description: >
  Generates the next release tag in `YYYY.MM.PATCH` format. PATCH is a
  sequential counter within the current calendar month (NOT the day of
  the month) — it increments on every release and resets to 0 when the
  month rolls over. Example: 2026.6.8 is the 9th release of June 2026,
  regardless of which day in June it was cut. Tags follow SemVer rules
  (no leading zeros) so GitHub's /releases/latest auto-determination
  works without explicit makeLatest overrides.

inputs:
  token:
    description: GitHub Token
    required: true

outputs:
  tag:
    description: Release Tag
    value: ${{ steps.release.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Get Release Tag
      id: release
      uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
      with:
        github-token: ${{ inputs.token }}
        script: |
          // Fetch the most-recently-created release. The action assumes
          // releases are created in monotonic order — manual out-of-order
          // releases will break the sequence.
          const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1,
          });

          const prevTag = releases[0]?.tag_name || "0.0.0";
          const [prevMajor, prevMinor, prevPatch] = prevTag.split('.').map(Number);
          const now = new Date();
          // getMonth() is 0-indexed; +1 yields the 1-12 calendar month.
          const nextMajorMinor = `${now.getFullYear()}.${now.getMonth() + 1}`;
          // PATCH = sequential within YEAR.MONTH. Resets to 0 on month rollover.
          // Comparison is on parsed-then-restringified values, which strips any
          // leading zeros from historical mistakes — same logical month always
          // compares equal regardless of how the previous tag was formatted.
          const nextPatch = `${prevMajor}.${prevMinor}` === nextMajorMinor ? prevPatch + 1 : 0;

          core.setOutput('tag', `${nextMajorMinor}.${nextPatch}`);
