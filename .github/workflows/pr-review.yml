name: PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    uses: lenaxia/ai-workflows/.github/workflows/pr-review.yml@v0.2.25 # v0.2.10
    secrets: inherit
    with:
      version: v0.2.10
      project_name: functions
