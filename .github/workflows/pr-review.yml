name: PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    uses: lenaxia/ai-workflows/.github/workflows/pr-review.yml@5f900a244307742c21918da334993a3f044bbd6f # v0.2.10
    secrets: inherit
    with:
      version: v0.2.10
      project_name: functions
