---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches: ["main"]
    paths: ["functions/**"]
  workflow_dispatch:
    inputs:
      function:
        type: string
        description: Function Name
        required: true
      release:
        type: boolean
        description: Release
        required: false
        default: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@1a5aeab1bfa64d0c4e786f501d5a3f1fad4a24da # v0.4.1
        with:
          path: functions
          include_only_directories: true
          max_depth: 1

  changed:
    if: ${{ needs.prepare.outputs.changed-files != '[]' || github.event_name == 'workflow_dispatch' }}
    needs: ["prepare"]
    name: Get Changed Functions
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.functions.outputs.functions }}
    steps:
      - name: Get Functions
        id: functions
        # Pass workflow expressions through env vars rather than splicing
        # them directly into the shell script. action-changed-files emits a
        # JSON array like ["violetscans"]; splicing that into
        # CHANGED="${{ … }}" produces broken nested quoting and silently
        # corrupts the value. Env-var injection is the safe pattern.
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          DISPATCH_FUNCTION: ${{ inputs.function }}
          CHANGED_FILES: ${{ needs.prepare.outputs.changed-files }}
        run: |
          if [ "$GH_EVENT_NAME" == "workflow_dispatch" ]; then
            printf 'functions=["%s"]\n' "$DISPATCH_FUNCTION" >> "$GITHUB_OUTPUT"
          elif [ -n "$CHANGED_FILES" ] && [ "$CHANGED_FILES" != "[]" ]; then
            printf 'functions=%s\n' "$CHANGED_FILES" >> "$GITHUB_OUTPUT"
          else
            printf 'functions=[]\n' >> "$GITHUB_OUTPUT"
          fi

  build:
    if: ${{ !cancelled() && needs.changed.result == 'success' && needs.changed.outputs.functions != '[]' }}
    needs: ["changed"]
    name: Build ${{ matrix.function }}
    uses: ./.github/workflows/function-builder.yaml
    permissions:
      contents: write
      id-token: write
    secrets: inherit
    strategy:
      matrix:
        function: ${{ fromJSON(needs.changed.outputs.functions) }}
      fail-fast: false
      max-parallel: 4
    with:
      function: ${{ matrix.function }}
      release: ${{ github.event_name == 'workflow_dispatch' && inputs.release || github.event_name == 'push' }}

  status:
    if: ${{ !cancelled() }}
    needs: ["changed", "build"]
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        run: |
          if [ "${{ needs.changed.result }}" == "failure" ]; then
            echo "Changed job failed"
            exit 1
          fi
          if [ "${{ needs.build.result }}" == "failure" ]; then
            echo "Build job failed"
            exit 1
          fi
          if [ "${{ needs.build.result }}" == "skipped" ] && [ "${{ needs.changed.result }}" == "success" ]; then
            echo "Build was skipped but changed succeeded - this means no functions to build"
            exit 0
          fi
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "All jobs completed successfully"
            exit 0
          fi
          echo "Unexpected job state"
          echo "Changed: ${{ needs.changed.result }}"
          echo "Build: ${{ needs.build.result }}"
