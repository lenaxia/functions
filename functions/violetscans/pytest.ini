[pytest]
testpaths = tests
python_files = test_*.py
# Collect only classes named Test* and functions named test_*. The earlier
# `python_classes = *` / `python_functions = *` rules accidentally treated
# helper functions (e.g. _seed_secret, _build_clients_and_scratch) as tests.
python_classes = Test*
python_functions = test_*
addopts = -v
